name: Build PayAviator Release

# Builds the signed release APK + Play Store AAB from the source at the repository root.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.apk'
      - '**/*.aab'
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: payaviator-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository layout
        shell: bash
        run: |
          set -euo pipefail
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml \
                   VERSION.txt ANDROID_VERSION_CODE.txt index.html tools/verify-foundation.py; do
            test -f "$f" || { echo "::error::Missing $f at the repository root. Upload the unzipped PayAviator source, not a ZIP."; exit 1; }
          done

      - name: Read app version and Android versionCode
        id: version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(sed -E 's/^[Vv]ersion:[[:space:]]*//' VERSION.txt | tr -d '\r' | xargs)"
          echo "$EXPECTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          FLOOR="$(tr -d '[:space:]' < ANDROID_VERSION_CODE.txt)"
          VERSION_CODE=$((400000 + GITHUB_RUN_NUMBER))
          if (( VERSION_CODE < FLOOR )); then VERSION_CODE=$FLOOR; fi
          if (( VERSION_CODE > 2100000000 )); then echo '::error::Android versionCode too large.'; exit 1; fi
          echo "EXPECTED_VERSION=$EXPECTED_VERSION" >> "$GITHUB_ENV"
          echo "PAYAVIATOR_ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building PayAviator $EXPECTED_VERSION (Android versionCode $VERSION_CODE)"

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          grep -F "applicationId 'com.payaviator.app'" app/build.gradle
          grep -F "rootProject.file('VERSION.txt')" app/build.gradle
          grep -F "versionName payAviatorVersion" app/build.gradle
          grep -F "versionCode payAviatorVersionCode" app/build.gradle
          grep -F "syncPayAviatorWebAssets" app/build.gradle
          python3 tools/verify-foundation.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform 36 and build tools
        shell: bash
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-cleanup: on-success

      - name: Restore signing key
        shell: bash
        env:
          KEY_HEX: ${{ secrets.PAYAVIATOR_KEYSTORE_HEX }}
          KEY_PASSWORD: ${{ secrets.PAYAVIATOR_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_HEX" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Set the PAYAVIATOR_KEYSTORE_HEX and PAYAVIATOR_KEYSTORE_PASSWORD repository secrets. They must hold the current PayAviator release key (introduced in 3.9.6); always sign with that same key.'
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/payaviator-release.jks"
          printf '%s' "$KEY_HEX" | tr -d '[:space:]' | xxd -r -p > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE" || { echo '::error::The keystore secret could not be decoded from HEX.'; exit 1; }
          # Accept any alias: the key itself is kept; only this temporary runner copy is renamed to "payaviator".
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEY_PASSWORD" -alias payaviator >/dev/null 2>&1; then
            OLD_ALIAS="$(keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEY_PASSWORD" 2>/dev/null | awk -F, '/PrivateKeyEntry/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}')"
            if [[ -z "$OLD_ALIAS" ]]; then echo '::error::The keystore or password is invalid, or it contains no private key.'; exit 1; fi
            keytool -changealias -keystore "$KEYSTORE_FILE" -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$OLD_ALIAS" -destalias payaviator
          fi
          echo "PAYAVIATOR_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        shell: bash
        env:
          PAYAVIATOR_KEYSTORE_PASSWORD: ${{ secrets.PAYAVIATOR_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify packaged web assets and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          test -f app/build/outputs/bundle/release/app-release.aab
          python3 tools/verify-apk-assets.py "$APK"
          SIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$SIGNER" || { echo '::error::apksigner not found.'; exit 1; }
          "$SIGNER" verify --print-certs "$APK"

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/payaviator-release"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp app/build/outputs/apk/release/app-release.apk "$OUT/PayAviator-$EXPECTED_VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$OUT/PayAviator-$EXPECTED_VERSION.aab"
          cp VERSION.txt "$OUT/VERSION.txt"

      - name: Upload PayAviator release
        uses: actions/upload-artifact@v4
        with:
          name: PayAviator-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/payaviator-release/PayAviator-${{ steps.version.outputs.version }}.apk
            ${{ runner.temp }}/payaviator-release/PayAviator-${{ steps.version.outputs.version }}.aab
            ${{ runner.temp }}/payaviator-release/VERSION.txt
          if-no-files-found: error
          retention-days: 14
